[package]
name = "fenced-runtime-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
hex = "0.4.3"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
uuid = { version = "1.18.1", features = ["v7"] }
# Pinned to the 48.0.x line for RUSTSEC-2026-0315/0316/0325/0326/0327, all of
# which are fixed in 48.0.4. `wit-component`/`wit-parser`/`wat` must stay on the
# same wasm-tools generation as wasmtime (the `wasmparser` version is the shared
# ABI), so they move together. `wat` is pinned with `=` because a caret range
# would pull a second wasm-tools generation (`wast 261` -> `wasm-encoder 0.261`)
# into the graph alongside wasmtime's 0.254.
wasmtime = { version = "48.0.5", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "wat"] }
wat = "=1.254.2"
wit-component = "0.254.2"
wit-parser = "0.254.2"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
