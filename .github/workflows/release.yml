name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: fenced_test
          POSTGRES_USER: fenced
          POSTGRES_PASSWORD: fenced-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fenced -d fenced_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      FENCED_TEST_DATABASE_URL: postgres://fenced:fenced-test-only@127.0.0.1:5432/fenced_test?sslmode=disable
      FENCED_TEST_NATS_URL: nats://127.0.0.1:4222
      FENCED_E2E_PYTHON: python3
      FENCED_E2E_WORKFLOWS: 100
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify release identity and source
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(go run ./cmd/fenced version -json | jq -r .semver)"
          test "$GITHUB_REF_NAME" = "v${source_version}"
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          git diff --exit-code
          go mod verify

      - name: Run GA gates
        run: |
          docker run --detach --name fenced-release-nats --publish 4222:4222 nats:2.14.1-alpine@sha256:ea17b9b7f74279b9239cf65e5786c0133e9a7c353bf218d29004abf2e7a33181 --jetstream
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go test -race -count=1 ./...
          go test -race -tags=integration -count=1 -timeout 60m ./...
          go tool govulncheck ./...
          go build ./cmd/...
          (cd sdk/python && python3 -m unittest discover -s tests -v)
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/python-wheel" sdk/python
          (cd sdk/typescript && npm ci)
          (cd sdk/typescript && npm test)

      - name: Install pinned supply-chain tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.0
          cargo +1.97.1 install cargo-cyclonedx --version 0.5.9 --locked
          python3 -m pip install cyclonedx-bom==7.3.1
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Build reproducible release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          commands=(fenced fenced-conformance fenced-control fenced-controller fenced-gateway fenced-migrate fenced-orchestrator fenced-outbox fenced-pkg fenced-projector fenced-runtime-adapter fenced-runtime-control fenced-runtime-oci fenced-runtime-reference fenced-slo fenced-svid)
          platforms=(linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64)
          commit="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ldflags="-s -w -X github.com/CloudEdgeCore/Fenced/internal/version.Commit=${commit} -X github.com/CloudEdgeCore/Fenced/internal/version.BuildTime=${build_time}"
          cargo +1.97.1 build --release --locked --bin fenced-runtime-wasm
          for platform in "${platforms[@]}"; do
            goos="${platform%-*}"
            goarch="${platform#*-}"
            stage="${RUNNER_TEMP}/fenced-${GITHUB_REF_NAME}-${platform}"
            mkdir -p "$stage"
            for command in "${commands[@]}"; do
              suffix=""
              if [[ "$goos" == windows ]]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$stage/${command}${suffix}" "./cmd/${command}"
            done
            if [[ "$platform" == linux-amd64 ]]; then
              cp target/release/fenced-runtime-wasm "$stage/fenced-runtime-wasm"
            fi
            if [[ "$goos" == windows ]]; then
              (cd "$stage" && zip -q -9 -r "${GITHUB_WORKSPACE}/dist/fenced-${GITHUB_REF_NAME}-${platform}.zip" .)
            else
              tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -C "$stage" -czf "dist/fenced-${GITHUB_REF_NAME}-${platform}.tar.gz" .
            fi
          done
          python3 -m pip wheel --no-deps --wheel-dir dist sdk/python
          (cd sdk/typescript && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
      - name: Generate SBOM, checksums, and keyless signature
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cyclonedx-gomod mod -json -output-version 1.6 -output "dist/fenced-${GITHUB_REF_NAME}.cdx.json" .
          cargo +1.97.1 cyclonedx --format json
          rust_sbom="$(find runtime/wasm -maxdepth 1 -type f \( -name '*.cdx.json' -o -name 'bom.json' \) -print -quit)"
          test -n "$rust_sbom"
          mv "$rust_sbom" "dist/fenced-${GITHUB_REF_NAME}-rust.cdx.json"
          (cd sdk/typescript && npm sbom --sbom-format cyclonedx) > "dist/fenced-${GITHUB_REF_NAME}-typescript.cdx.json"
          python3 -m venv "$RUNNER_TEMP/fenced-sbom-venv"
          "$RUNNER_TEMP/fenced-sbom-venv/bin/pip" install cyclonedx-bom==7.3.1 dist/*.whl
          "$RUNNER_TEMP/fenced-sbom-venv/bin/cyclonedx-py" environment --output-format JSON --output-file "dist/fenced-${GITHUB_REF_NAME}-python.cdx.json"
          (cd dist && sha256sum *.tar.gz *.zip *.whl *.tgz *.cdx.json > checksums.txt)
          cosign sign-blob --yes --bundle "dist/checksums.txt.sigstore.json" "dist/checksums.txt"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, uploading assets with clobber..."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            echo "Release $GITHUB_REF_NAME does not exist, creating..."
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Fenced $GITHUB_REF_NAME"
          fi
