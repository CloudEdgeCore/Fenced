# Firecracker KVM evidence: standalone workflow so a missing fenced-kvm
# runner can never block the rest of the nightly production evidence. This
# workflow runs independently and reports its own status.
#
# A job whose runs-on labels match no online runner is queued indefinitely,
# which leaves the run with no terminal state: run 34717646564 sat queued
# from 2026-09-12T20:37 onward. The preflight gate below converts "the
# runner is missing" into an explicit skip, so every run ends in a state an
# operator can act on.
#
# Operator action: once the `fenced-kvm` runner is online, set the
# repository variable FENCED_KVM_RUNNER_PROVISIONED to "true". Until then
# this job is skipped with a notice and never queues. The gate never turns a
# missing runner into a pass: the KVM job still asserts real /dev/kvm.
name: firecracker-kvm-evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: firecracker-kvm-evidence
  cancel-in-progress: false

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      provisioned: ${{ steps.check.outputs.provisioned }}
    steps:
      - name: Check whether the fenced-kvm runner is provisioned
        id: check
        env:
          FENCED_KVM_RUNNER_PROVISIONED: ${{ vars.FENCED_KVM_RUNNER_PROVISIONED }}
        run: |
          if [ "${FENCED_KVM_RUNNER_PROVISIONED}" = "true" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
            echo "fenced-kvm runner declared provisioned"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the fenced-kvm runner is NOT provisioned. Skipping the Firecracker KVM probe instead of leaving it queued forever. Set the repository variable FENCED_KVM_RUNNER_PROVISIONED=true once the runner is online."
          fi

  firecracker-kvm:
    needs: runner-preflight
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 18 * * *')
      && needs.runner-preflight.outputs.provisioned == 'true'
    runs-on: [self-hosted, Linux, X64, fenced-kvm]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert real KVM and boot Firecracker
        run: |
          test -r /dev/kvm -a -w /dev/kvm
          bash deploy/ci/firecracker-smoke.sh
      - name: Report failure reason
        if: failure()
        run: |
          echo "::notice::KVM evidence failed on a runner declared provisioned. The preflight gate only routes here when the runner is online, so this is a real failure of the Firecracker probe path, not a missing runner."
