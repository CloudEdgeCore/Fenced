# Runtime isolation drills: real Wasmtime and OCI/gVisor sandbox execution +
# cross-runtime-class takeover. These prove the kernel dispatches to real
# sandboxes (not just runtime-class labels) and that pool-aware re-placement
# works across runtime boundaries.
name: runtime-isolation-drills

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1" # weekly, Monday 03:23 UTC

permissions:
  contents: read

concurrency:
  group: runtime-isolation-drills
  cancel-in-progress: false

jobs:
  wasmtime-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: fenced_test
          POSTGRES_USER: fenced
          POSTGRES_PASSWORD: fenced-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fenced -d fenced_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      FENCED_TEST_DATABASE_URL: postgres://fenced:fenced-test-only@127.0.0.1:5432/fenced_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Set up Rust (Wasmtime provider)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Build Wasmtime worker + conformance component
        run: |
          cargo build --release --manifest-path runtime/wasm/Cargo.toml
          cargo build --release --manifest-path runtime/wasm/Cargo.toml --bin component-fixture
          ./target/release/component-fixture --out tmp/wasm-components/hello.wasm

      - name: Run Wasmtime isolation and takeover drills
        run: |
          go test -tags=integration -count=1 -timeout 30m -v -run 'TestWasmtimeIsolation|TestWasmtimeCrossClassPlacement' ./examples/devops-workflow/tests/e2e/

  oci-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: fenced_test
          POSTGRES_USER: fenced
          POSTGRES_PASSWORD: fenced-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fenced -d fenced_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      FENCED_TEST_DATABASE_URL: postgres://fenced:fenced-test-only@127.0.0.1:5432/fenced_test?sslmode=disable
      FENCED_RUN_OCI_DRILL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Install gVisor (runsc) + configure containerd
        run: |
          # GitHub runners already ship containerd (as the docker dependency
          # containerd.io); apt-installing the distro `containerd` package
          # conflicts with it and takes the docker daemon down. Use the
          # preinstalled containerd and only add the gVisor runtime.
          command -v ctr >/dev/null || sudo apt-get install -y containerd.io
          # gVisor (runsc + containerd-shim) from GitHub releases (storage.googleapis.com is stale)
          # gVisor >= 2026 bundles runsc and containerd-shim-runsc-v1 in a single tarball.
          (
            set -e
            ARCH=$(uname -m)
            case "$ARCH" in x86_64) GV_ARCH=x86_64 ;; aarch64) GV_ARCH=aarch64 ;; *) echo "unsupported arch $ARCH"; exit 1 ;; esac
            RUNSC_VERSION=$(curl -fsSL https://api.github.com/repos/google/gvisor/releases/latest | grep tag_name | cut -d'"' -f4)
            curl -fsSL -o gvisor.tar.bz2 "https://github.com/google/gvisor/releases/download/${RUNSC_VERSION}/gvisor-${GV_ARCH}.tar.bz2"
            tar -xjf gvisor.tar.bz2 runsc containerd-shim-runsc-v1
            chmod 555 runsc containerd-shim-runsc-v1
            sudo mv runsc /usr/local/bin/runsc
            sudo mv containerd-shim-runsc-v1 /usr/local/bin/containerd-shim-runsc-v1
            sudo mkdir -p /etc/containerd
            sudo cp deploy/ci/containerd-config.toml /etc/containerd/config.toml
            # The executor passes --runtime-config-path unconditionally; an
            # empty (valid) runsc config satisfies it. New gVisor releases no
            # longer ship runsc.toml.
            sudo touch /etc/containerd/runsc.toml
            sudo systemctl enable containerd 2>/dev/null || true
            sudo systemctl restart containerd
          )
          # The system containerd restart must not take docker down with it.
          docker info >/dev/null 2>&1 || sudo systemctl restart docker

      - name: Build agent-runtime image and import into containerd
        run: |
          docker build -t fenced-runtime:latest -f deploy/oci/agent-runtime/Dockerfile .
          docker save fenced-runtime:latest | sudo ctr -n fenced images import -
          # Verify the image is findable; containerd treats a positional
          # arg as a filter (which chokes on the / in the reference), so
          # list and match instead.
          sudo ctr -n fenced images ls -q | grep -xF docker.io/library/fenced-runtime:latest
          # The real-takeover drill runs a long-lived workload inside an
          # alpine image (the OCI worker starts with -skip-image-pull), so it
          # must be preloaded into containerd as well.
          sudo ctr -n fenced images pull docker.io/library/alpine:latest

      - name: Build OCI worker
        run: |
          mkdir -p bin
          go build -o bin/fenced-runtime-oci ./cmd/fenced-runtime-oci

      - name: Smoke-test gVisor container execution
        run: |
          sudo ctr -n fenced run --rm --runtime io.containerd.runsc.v1 \
            docker.io/library/fenced-runtime:latest gvisor-smoke 2>&1
          echo "gVisor sandbox verified: container executed and exited"

      - name: Run OCI/gVisor isolation and takeover drills
        run: |
          go test -tags=integration -count=1 -timeout 30m -v -run 'TestOCIIsolation|TestOCICrossClassPlacement|TestOCIRealTakeover' ./examples/devops-workflow/tests/e2e/
