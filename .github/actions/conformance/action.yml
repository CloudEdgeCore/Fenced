name: 'Fenced Conformance Certification'
description: 'Certifies that an AI Agent Runtime or Framework complies with the Fenced Runtime Interface v1 specification.'
author: 'CloudEdgeCore'

inputs:
  endpoint:
    description: 'Existing HTTP endpoint of the running adapter server (e.g. http://127.0.0.1:8088)'
    required: false
    default: ''
  command:
    description: 'Command to launch candidate adapter process (e.g. "python server.py --port 0")'
    required: false
    default: ''
  timeout:
    description: 'Maximum time to allow for the conformance suite run (e.g. 2m)'
    required: false
    default: '2m'
  fenced-version:
    description: 'Version of Fenced Conformance Suite binary to download or build'
    required: false
    default: 'v1.3.0'

outputs:
  status:
    description: 'Certification outcome: PASS or FAIL'
    value: ${{ steps.run-suite.outputs.status }}
  badge-markdown:
    description: 'Markdown badge snippet to include in README'
    value: '[![Fenced Compatible](https://img.shields.io/badge/Fenced-Compatible-brightgreen.svg)](https://github.com/CloudEdgeCore/Fenced)'

runs:
  using: 'composite'
  steps:
    - name: Set up Go toolchain
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        check-latest: false

    - name: Run Conformance Suite
      id: run-suite
      shell: bash
      run: |
        set -euo pipefail
        
        FLAGS=()
        if [ -n "${{ inputs.endpoint }}" ]; then
          FLAGS+=(-endpoint "${{ inputs.endpoint }}")
        fi
        if [ -n "${{ inputs.command }}" ]; then
          FLAGS+=(-cmd "${{ inputs.command }}")
        fi
        if [ -n "${{ inputs.timeout }}" ]; then
          FLAGS+=(-timeout "${{ inputs.timeout }}")
        fi

        echo "=== Executing Fenced Conformance Suite ==="
        OUTPUT=$(go run github.com/CloudEdgeCore/Fenced/cmd/fenced-conformance@${{ inputs.fenced-version }} "${FLAGS[@]}")
        echo "$OUTPUT"

        if echo "$OUTPUT" | grep -q "Fenced Compatible = PASS"; then
          echo "status=PASS" >> "$GITHUB_OUTPUT"
          echo "::notice title=Fenced Certified::Runtime verified compatible with Fenced Kernel! Use badge: [![Fenced Compatible](https://img.shields.io/badge/Fenced-Compatible-brightgreen.svg)](https://github.com/CloudEdgeCore/Fenced)"
        else
          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "::error title=Fenced Conformance Failed::Candidate runtime failed one or more conformance checks."
          exit 1
        fi
