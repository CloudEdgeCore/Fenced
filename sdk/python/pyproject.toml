[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fenced-runtime"
version = "1.3.0"
description = "Stable Fenced Runtime Interface SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Fenced maintainers"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/CloudEdgeCore/Fenced"
Issues = "https://github.com/CloudEdgeCore/Fenced/issues"

[tool.setuptools]
packages = ["fenced_runtime", "fenced_runtime.provider"]

[tool.setuptools.package-data]
fenced_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
