# Cargo Audit Configuration
# https://rustsec.org/

[advisories]
# No ignores. The wasmtime 47 fuel-accounting advisories that used to be listed
# here (RUSTSEC-2026-0315, RUSTSEC-2026-0316) are fixed in wasmtime 48.0.3+,
# which this workspace now pins, so suppressing them would mask a regression if
# the pin were ever rolled back.
#
# NOTE: cargo-audit resolves ./audit.toml before ./.cargo/audit.toml, so this
# file is the effective one. ./.cargo/audit.toml is kept in sync deliberately.
ignore = []
