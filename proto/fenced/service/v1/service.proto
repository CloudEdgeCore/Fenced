syntax = "proto3";

package fenced.service.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/CloudEdgeCore/Fenced/gen/go/fenced/service/v1;servicev1";

// AgentService manages the lifecycle of long-running, supervised Daemon Agent Services.
// v1 field numbers, RPC signatures, and wire formats are FROZEN (v1.2 Contract Freeze).
service ServiceManagementService {
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse);
  rpc ScaleService(ScaleServiceRequest) returns (ScaleServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc DrainInstance(DrainInstanceRequest) returns (DrainInstanceResponse);
  rpc RolloutUpgrade(RolloutUpgradeRequest) returns (RolloutUpgradeResponse);
  rpc RollbackService(RollbackServiceRequest) returns (RollbackServiceResponse);
}

enum ServicePhase {
  SERVICE_PHASE_UNSPECIFIED = 0;
  SERVICE_PHASE_PENDING = 1;
  SERVICE_PHASE_ACTIVE = 2;
  SERVICE_PHASE_DEGRADED = 3;
  SERVICE_PHASE_DRAINING = 4;
  SERVICE_PHASE_TERMINATED = 5;
}

enum InstancePhase {
  INSTANCE_PHASE_UNSPECIFIED = 0;
  INSTANCE_PHASE_STARTING = 1;
  INSTANCE_PHASE_RUNNING = 2;
  INSTANCE_PHASE_DRAINING = 3;
  INSTANCE_PHASE_STOPPED = 4;
  INSTANCE_PHASE_FAILED = 5;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_ALWAYS = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_NEVER = 3;
}

message HealthConfig {
  google.protobuf.Duration heartbeat_ttl = 1;
  int32 unhealthy_threshold = 2;
  google.protobuf.Duration check_interval = 3;
}

message RolloutConfig {
  int32 max_surge = 1;
  int32 max_unavailable = 2;
  google.protobuf.Duration drain_timeout = 3;
  google.protobuf.Duration min_ready_seconds = 4;
  bool auto_rollback = 5;
}

message ServiceSpec {
  int32 replicas = 1;
  string agent_version = 2;
  RestartPolicy restart_policy = 3;
  HealthConfig health = 4;
  google.protobuf.Duration drain_timeout = 5;
  RolloutConfig rollout = 6;
  bool auto_wake = 7;
  map<string, string> env = 8;
  map<string, string> metadata = 9;
}

message ServiceStatus {
  ServicePhase phase = 1;
  int32 desired_replicas = 2;
  int32 current_replicas = 3;
  int32 ready_replicas = 4;
  int32 updated_replicas = 5;
  int32 available_replicas = 6;
  string active_version = 7;
  string target_version = 8;
  int32 restart_count = 9;
  google.protobuf.Timestamp last_transition_at = 10;
  string message = 11;
}

message ServiceInstance {
  string id = 1;
  string service_id = 2;
  string tenant_id = 3;
  string namespace = 4;
  string agent_id = 5;
  string agent_version = 6;
  InstancePhase phase = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp last_heartbeat_at = 10;
  int32 restart_count = 11;
  string exit_reason = 12;
}

message AgentService {
  string id = 1;
  string tenant_id = 2;
  string namespace = 3;
  string name = 4;
  string agent_id = 5;
  ServiceSpec spec = 6;
  ServiceStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateServiceRequest {
  string tenant_id = 1;
  string namespace = 2;
  string name = 3;
  string agent_id = 4;
  ServiceSpec spec = 5;
}

message CreateServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message GetServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  string namespace = 3;
  string name = 4;
}

message GetServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message ListServicesRequest {
  string tenant_id = 1;
  string namespace = 2;
}

message ListServicesResponse {
  repeated AgentService services = 1;
}

message UpdateServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  ServiceSpec spec = 3;
}

message UpdateServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message ScaleServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
  int32 replicas = 3;
}

message ScaleServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message RestartServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message RestartServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message StopServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message StopServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message DeleteServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message DeleteServiceResponse {
  bool deleted = 1;
}

message DrainInstanceRequest {
  string tenant_id = 1;
  string service_id = 2;
  string instance_id = 3;
  google.protobuf.Duration timeout = 4;
}

message DrainInstanceResponse {
  bool draining = 1;
}

message RolloutUpgradeRequest {
  string tenant_id = 1;
  string service_id = 2;
  string new_version = 3;
  RolloutConfig config = 4;
}

message RolloutUpgradeResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}

message RollbackServiceRequest {
  string tenant_id = 1;
  string service_id = 2;
}

message RollbackServiceResponse {
  AgentService service = 1;
  repeated ServiceInstance instances = 2;
}
