syntax = "proto3";

package fenced.effect.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/CloudEdgeCore/Fenced/gen/go/fenced/effect/v1;effectv1";

// Durable external side-effect API with monotonic fencing, idempotent replay protection,
// and unambiguous terminal state accounting.
// v1 field numbers, RPC signatures, and error semantics are FROZEN (v1.2 Contract Freeze).
service EffectService {
  rpc ExecuteEffect(ExecuteEffectRequest) returns (ExecuteEffectResponse);
  rpc GetEffect(GetEffectRequest) returns (GetEffectResponse);
  rpc GetEffectByIdempotencyKey(GetEffectByIdempotencyKeyRequest) returns (GetEffectByIdempotencyKeyResponse);
}

enum EffectStatus {
  EFFECT_STATUS_UNSPECIFIED = 0;
  EFFECT_STATUS_PENDING = 1;
  EFFECT_STATUS_EXECUTING = 2;
  // Committed external effect: exactly-once side-effect proof. Safe to replay idempotently.
  EFFECT_STATUS_COMMITTED = 3;
  // Definitively failed by provider.
  EFFECT_STATUS_FAILED = 4;
  // Ambiguous outcome (timeout, connection reset). MUST NEVER be blindly retried or auto-replayed.
  EFFECT_STATUS_UNKNOWN = 5;
}

message EffectRequest {
  string effect_id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string run_id = 4;
  string attempt_id = 5;
  int64 fencing_token = 6;
  string provider = 7;
  string operation = 8;
  string idempotency_key = 9;
  string payload_hash = 10;
  bytes payload = 11;
  google.protobuf.Timestamp deadline = 12;
  string trace_id = 13;
  google.protobuf.Timestamp created_at = 14;
}

message EffectReceipt {
  string effect_id = 1;
  string tenant_id = 2;
  EffectStatus status = 3;
  bytes provider_receipt = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  string attempt_id = 7;
  int64 fencing_token = 8;
  string result_hash = 9;
  string error_message = 10;
}

message EffectRecord {
  EffectRequest request = 1;
  EffectReceipt receipt = 2;
  EffectStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int64 version = 6;
}

message ExecuteEffectRequest {
  EffectRequest request = 1;
}

message ExecuteEffectResponse {
  EffectReceipt receipt = 1;
  bool replayed = 2;
}

message GetEffectRequest {
  string tenant_id = 1;
  string effect_id = 2;
}

message GetEffectResponse {
  EffectRecord record = 1;
}

message GetEffectByIdempotencyKeyRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string idempotency_key = 3;
}

message GetEffectByIdempotencyKeyResponse {
  EffectRecord record = 1;
}
