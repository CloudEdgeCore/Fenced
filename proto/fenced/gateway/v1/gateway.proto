syntax = "proto3";

package fenced.gateway.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/CloudEdgeCore/Fenced/gen/go/fenced/gateway/v1;gatewayv1";

// Stable capability gateways. v1 field numbers and RPC names are frozen.
service ToolGatewayService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc InvokeTool(InvokeToolRequest) returns (InvokeToolResponse);
}
service MemoryGatewayService {
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);
  rpc PutMemory(PutMemoryRequest) returns (PutMemoryResponse);
}
message AttemptIdentity { string tenant_id = 1; string attempt_id = 2; int64 fencing_token = 3; }
message ToolDescriptor { string name = 1; string version = 2; string side_effect_risk = 3; repeated string actions = 4; repeated string resource_patterns = 5; bytes params_schema_json = 6; string spec_digest = 7; google.protobuf.Timestamp created_at = 8; }
message ListToolsRequest { string tenant_id = 1; string agent_version_ref = 2; }
message ListToolsResponse { repeated ToolDescriptor tools = 1; }
message InvokeToolRequest { AttemptIdentity identity = 1; string task_id = 2; string run_id = 3; string agent_version_ref = 4; string tool_name = 5; string tool_version = 6; string action = 7; string resource = 8; bytes args_json = 9; string idempotency_key = 10; string approval_id = 11; string secret_ref = 12; }
message InvokeToolResponse { string outcome = 1; bytes result_json = 2; string approval_id = 3; repeated string deny_reasons = 4; string policy_revision = 5; string receipt_operation = 6; string tool_call_id = 7; }
message SearchMemoryRequest { AttemptIdentity identity = 1; string agent_version_ref = 2; string namespace = 3; string query = 4; string sensitivity = 5; int32 limit = 6; }
message MemoryRecord { string id = 1; string namespace = 2; string key = 3; string content_type = 4; string content = 5; string sensitivity = 6; int64 resource_version = 7; google.protobuf.Timestamp created_at = 8; google.protobuf.Timestamp updated_at = 9; }
message SearchMemoryResponse { repeated MemoryRecord records = 1; }
message PutMemoryRequest { AttemptIdentity identity = 1; string agent_version_ref = 2; string namespace = 3; string key = 4; string content_type = 5; string content = 6; string sensitivity = 7; bytes provenance_json = 8; }
message PutMemoryResponse { MemoryRecord record = 1; bool replayed = 2; }
