syntax = "proto3";

package fenced.model.v1;

import "fenced/model/v1/model.proto";

option go_package = "github.com/CloudEdgeCore/Fenced/gen/go/fenced/model/v1;modelv1";

// Real model execution behind the fenced decision chain (v1.1). The frozen
// ModelGatewayService governs Begin/Settle/Finish; this additive service
// executes an invocation: policy, budget and ledger run first, the provider
// call streams second, and the exact usage settles at the terminal chunk.
// Prompt and completion content crosses this service but is never persisted.
service ModelInvocationService {
  // Invoke executes one model invocation, streaming content deltas and a
  // terminal finish (or structured failure) chunk.
  rpc Invoke(InvokeRequest) returns (stream InvokeResponse);
}

message ChatToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message ChatMessage {
  string role = 1;
  string content = 2;
  // tool_call_id binds a tool-role turn to its originating call.
  string tool_call_id = 3;
  // tool_calls carries the model-requested calls of an assistant turn.
  repeated ChatToolCall tool_calls = 4;
}

// ToolDefinition declares one callable tool to the model: the platform (not
// the sandbox) generates the schema from the granted tool registry, so a
// sandboxed agent cannot invent or widen tool contracts.
message ToolDefinition {
  string name = 1;
  string description = 2;
  // parameters_json is the JSON Schema of the tool's input contract.
  string parameters_json = 3;
}

message InvokeRequest {
  AttemptIdentity identity = 1;
  string task_id = 2;
  string run_id = 3;
  string agent_version_ref = 4;
  string model_ref = 5;
  string idempotency_key = 6;
  repeated ChatMessage messages = 7;
  bool stream = 8;
  optional double temperature = 9;
  int32 max_output_tokens = 10;
  // tools are the granted, platform-described tools the model may call.
  repeated ToolDefinition tools = 11;
}

// InvokeResponse is one streamed chunk: a content delta, a model-requested
// tool call, or the terminal finish / structured failure.
message InvokeResponse {
  string delta = 1;
  ChatToolCall tool_call = 2;
  InvokeFinish finish = 3;
  InvokeFailure failure = 4;
}

message InvokeFinish {
  string call_id = 1;
  string model_ref = 2;
  string status = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  double cost_usd = 6;
  string price_revision = 7;
  string finish_reason = 8;
  string provider_request_id = 9;
  // content repeats the fully assembled completion for unary-style callers.
  string content = 10;
}

message InvokeFailure {
  string code = 1;
  string message = 2;
  string finish_reason = 3;
}
