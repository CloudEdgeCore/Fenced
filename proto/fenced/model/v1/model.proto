syntax = "proto3";

package fenced.model.v1;

option go_package = "github.com/CloudEdgeCore/Fenced/gen/go/fenced/model/v1;modelv1";

// Stable fenced model gateway. Prompt and completion content never crosses it.
service ModelGatewayService {
  rpc Begin(BeginRequest) returns (BeginResponse);
  rpc Settle(SettleRequest) returns (SettleResponse);
  rpc Finish(FinishRequest) returns (FinishResponse);
}
message AttemptIdentity { string tenant_id = 1; string attempt_id = 2; int64 fencing_token = 3; }
message BeginRequest { AttemptIdentity identity = 1; string task_id = 2; string run_id = 3; string agent_version_ref = 4; string model_ref = 5; string idempotency_key = 6; }
message BeginResponse { string call_id = 1; string model_ref = 2; string status = 3; string price_revision = 4; string policy_revision = 5; int64 resource_version = 6; }
message SettleRequest { AttemptIdentity identity = 1; string call_id = 2; int64 sequence = 3; int64 input_tokens = 4; int64 output_tokens = 5; }
message SettleResponse { string call_id = 1; }
message FinishRequest { AttemptIdentity identity = 1; string call_id = 2; int64 expected_version = 3; string status = 4; int64 input_tokens = 5; int64 output_tokens = 6; string provider_request_id = 7; string finish_reason = 8; }
message FinishResponse { string call_id = 1; string model_ref = 2; string status = 3; int64 input_tokens = 4; int64 output_tokens = 5; double cost_usd = 6; string price_revision = 7; string finish_reason = 8; }
