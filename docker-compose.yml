# Root convenience entry point for the local development dependencies.
#
#   docker compose up -d --wait postgres nats
#
# The canonical environment definition lives in deploy/dev/compose.yaml and is
# included here so there is a single source of truth. Optional observability,
# secrets, and search services use the same profiles:
#
#   docker compose --profile observability up -d
#   docker compose --profile secrets up -d
#   docker compose --profile search up -d
#
# Application processes (fenced-migrate, fenced-control, fenced-controller,
# fenced-outbox, fenced-gateway, fenced-runtime-control,
# fenced-runtime-reference) run on the host via `go run` as documented in
# README.md. They are intentionally not containerized here: development
# identity requires loopback-only listeners, which port-published containers
# cannot provide. Production deployments define their own topology under
# deploy/helm and deploy/oci.
name: fenced-dev

include:
  - path: deploy/dev/compose.yaml
