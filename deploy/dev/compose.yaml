name: fenced-dev

services:
  postgres:
    # pgvector image: the v0.1 Memory slice (ADR-009) requires the vector
    # extension alongside FTS/pg_trgm.
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_DB: fenced
      POSTGRES_USER: fenced
      POSTGRES_PASSWORD: fenced-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenced -d fenced"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  nats:
    image: nats:2.14.1-alpine@sha256:ea17b9b7f74279b9239cf65e5786c0133e9a7c353bf218d29004abf2e7a33181
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "127.0.0.1:54222:4222"
    volumes:
      - nats-data:/data

  # Reference observability stack (tech baseline §15). Opt in with:
  #   docker compose --profile observability up -d
  # Agent processes export OTLP to 127.0.0.1:4317 when
  # OTEL_EXPORTER_OTLP_ENDPOINT is set; Grafana runs on http://127.0.0.1:3300.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    profiles: ["observability"]
    command: ["--config", "/etc/otel/collector.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:9093:9090"
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3320:3200"
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3310:3100"
    volumes:
      - ./otel/loki.yaml:/etc/loki/loki.yaml:ro

  grafana:
    image: grafana/grafana:11.6.2
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./otel/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  # Reference OpenSearch Secret Broker (ADR-012). Opt in with:
  #   docker compose --profile secrets up -d
  # The dev server runs unsealed with the fixed root token; the Tool Gateway
  # connects with -bao-addr http://127.0.0.1:58200 -bao-token bao-dev-only.
  openbao:
    image: openbao/openbao:2.4.0
    profiles: ["secrets"]
    command: ["server", "-dev", "-dev-root-token-id=bao-dev-only"]
    environment:
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:58200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Reference OpenSearch search projection (ADR-013). Opt in with:
  #   docker compose --profile search up -d
  # Security is disabled for dev; the projector connects to
  # http://127.0.0.1:39200 with index fenced-memory.
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:39200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  nats-data:
