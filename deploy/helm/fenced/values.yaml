# Production Control API only. Configure the required fields below before
# installing; credentials live in existing Secrets in the release namespace.

replicaCount: 2

image:
  repository: ghcr.io/cloudedgecore/fenced
  pullPolicy: IfNotPresent
  tag: "1.4.0"

serviceAccount:
  create: true
  # Empty uses a release-specific name when create=true, or "default" otherwise.
  name: ""
  annotations: {}
  automountToken: false

# Rolling upgrade of the control plane. A new replica joins and becomes ready
# before an old one leaves, so the API stays reachable during the rollout.
upgrade:
  # The old replica is only taken away when the new one is serving.
  maxUnavailable: 0
  # The number of replicas that may exist above the desired count.
  maxSurge: 1
  # A replica has to stay ready for this long before it counts as available.
  minReadySeconds: 10
  # The rollout fails when a replica is not ready within this window, instead
  # of waiting forever.
  progressDeadlineSeconds: 600
  # The time a replica may take to finish its work before it is killed. The
  # control plane stops accepting new work on SIGTERM and finishes what it
  # has.
  terminationGracePeriodSeconds: 30
  # A voluntary disruption (a node drain) may not take the last replica down.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Delay between the removal of the replica from the Service and the
  # SIGTERM, so in-flight requests are not cut off. Needs a cluster with the
  # Sleep lifecycle handler (Kubernetes 1.29 or newer); 0 disables it.
  preStopSleepSeconds: 0

controlPlane:
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# External PostgreSQL must already contain the Fenced schema and extensions.
database:
  existingSecret: ""
  secretKey: "database-url"

# OIDC ID tokens supply the tenant scope; there is no static development tenant.
security:
  oidc:
    issuer: ""
    clientID: ""
    tenantClaim: "tenant"
  tls:
    existingSecret: ""
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
  audit:
    existingSecret: ""
    privateKeyKey: "audit-signing-key"
    keyID: "control-plane-audit"
  packageTrust:
    existingSecret: ""
    keysKey: "package-trust-keys"

embedding:
  endpoint: ""
  # Optional for embedding services that accept unauthenticated requests.
  tokenSecret: ""
  tokenSecretKey: "token"
