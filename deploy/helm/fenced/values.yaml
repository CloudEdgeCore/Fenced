# Production Control API only. Configure the required fields below before
# installing; credentials live in existing Secrets in the release namespace.

replicaCount: 2

image:
  repository: ghcr.io/cloudedgecore/fenced
  pullPolicy: IfNotPresent
  tag: "1.3.0"

serviceAccount:
  create: true
  # Empty uses a release-specific name when create=true, or "default" otherwise.
  name: ""
  annotations: {}
  automountToken: false

controlPlane:
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# External PostgreSQL must already contain the Fenced schema and extensions.
database:
  existingSecret: ""
  secretKey: "database-url"

# OIDC ID tokens supply the tenant scope; there is no static development tenant.
security:
  oidc:
    issuer: ""
    clientID: ""
    tenantClaim: "tenant"
  tls:
    existingSecret: ""
    certificateKey: "tls.crt"
    privateKeyKey: "tls.key"
  audit:
    existingSecret: ""
    privateKeyKey: "audit-signing-key"
    keyID: "control-plane-audit"
  packageTrust:
    existingSecret: ""
    keysKey: "package-trust-keys"

embedding:
  endpoint: ""
  # Optional for embedding services that accept unauthenticated requests.
  tokenSecret: ""
  tokenSecretKey: "token"
